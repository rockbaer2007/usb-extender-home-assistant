[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-extender-home-assistant"
version = "0.1.2"
description = "USB input and Stream Deck bridge with three MQTT brokers"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3", "Pillow>=11,<14", "streamdeck==0.10.0", "CairoSVG>=2.7,<3", "evdev>=1.7; sys_platform == 'linux'"]

[project.scripts]
ugso-usbhub = "ugso_usbhub.cli:main"
usb-extender = "ugso_usbhub.cli:main"

[tool.setuptools.package-data]
ugso_usbhub = ["static/*"]

[tool.setuptools.packages.find]
include = ["ugso_usbhub*"]
