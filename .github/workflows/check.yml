name: Linux checks
on:
  push:
    paths-ignore: ['**/*.md', '*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', '*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y libhidapi-libusb0 libcairo2 libffi-dev python3-dev
      - name: Python dependencies
        run: python -m pip install -r requirements.txt && python -m pip install --no-deps .
      - name: Unit and local protocol tests
        run: python -m unittest discover -v
      - name: SVG rendering
        run: python -c 'from ugso_usbhub.icons import raster; assert raster(b"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"10\" height=\"10\"><rect width=\"10\" height=\"10\" fill=\"red\"/></svg>", ".svg").startswith(b"\x89PNG")'
      - name: Syntax checks
        run: |
          bash -n install.sh scripts/ugso-usbhub
          node --check ugso_usbhub/static/app.js
          node --check ugso_usbhub/static/keylist.js
          node tests/keylist.test.cjs
          git diff --check
      - name: Tastenliste DOM workflow
        run: |
          npm install --prefix .state/ui-test jsdom@31.0.1 --ignore-scripts --no-audit --no-fund
          node tests/keylist-ui.test.cjs
      - name: Installer smoke test on isolated Linux runner
        run: |
          sudo bash install.sh </dev/null
          sudo usb-extender --version
          sudo install -o root -g input -m 640 /etc/hostname /tmp/usb-extender-input-probe
          sudo runuser -u ugso-usbhub -- cat /tmp/usb-extender-input-probe >/dev/null
          sudo rm /tmp/usb-extender-input-probe
          sudo systemctl is-active --quiet ugso-usbhub.service
          sudo systemd-analyze verify /etc/systemd/system/ugso-usbhub.service /etc/systemd/system/ugso-usbhub-web.service
          sudo runuser -u ugso-usbhub -- /opt/ugso-usbhub/current/.venv/bin/python - <<'PY'
          from ugso_usbhub.storage import load_config, save_config, password_hash
          config = load_config()
          config['password_hash'] = password_hash('ci-only-not-a-real-password')
          save_config(config)
          PY
          sudo usb-extender web start
          sleep 2
          curl --fail --max-time 5 http://127.0.0.1:8098/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/api/config)" = 401
          sudo usb-extender web stop
          if curl -s --max-time 2 http://127.0.0.1:8098/ >/dev/null; then exit 1; fi
          sudo systemctl is-active --quiet ugso-usbhub.service
          sudo systemctl restart ugso-usbhub.service
          sleep 2
          sudo systemctl is-active --quiet ugso-usbhub.service
      - name: Service logs on failure
        if: failure()
        run: sudo journalctl -u ugso-usbhub -u ugso-usbhub-web --no-pager -n 60
      - name: Build installation ZIP
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Extender-Home-Assistant-0.1.5-Raspi4
          path: dist/*
